[project]
name = "ecmfit"
version = "0.2.0"
description = "Fit equivalent-circuit model parameters to lithium-ion battery pulse, relaxation and impedance measurements"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Dominic Kupfer", email = "dominic.kupfer@gmx.net" }]
keywords = [
    "battery",
    "lithium-ion",
    "equivalent-circuit-model",
    "parameter-identification",
    "impedance-spectroscopy",
    "system-identification",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.1",
    "scipy>=1.14",
]

[project.urls]
Repository = "https://github.com/count-doku/fit-battery-data"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecmfit"]

[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["ecmfit", "tests"]
addopts = "--doctest-modules"
